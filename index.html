<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GUVEL PrePPAP Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="dot cyan"></span><span>GUVEL</span></div>
    <div class="brand-sub">PrePPAP Tracker</div>
    <nav>
      <button class="nav active" data-view="dashboard">Dashboard</button>
      <button class="nav" data-view="orders">PrePPAP Orders</button>
      <button class="nav" data-view="comp">Compensation</button>
    </nav>
    <div class="sidebar-foot">V2 · SharePoint-ready</div>
  </aside>

  <main>
    <header>
      <div>
        <div class="eyebrow">PREPPAP MANAGEMENT</div>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <button class="primary" id="newOrderBtn">+ New PrePPAP</button>
    </header>
    <section id="app"></section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>New PrePPAP Order</h2>
        <button id="closeModal" class="icon-btn">×</button>
      </div>
      <form id="orderForm">
        <div class="grid two">
          <label>Customer<input name="customer" required></label>
          <label>Part Number<input name="partNumber" required></label>
          <label>Order / Reference<input name="reference" placeholder="PP-2026-001" required></label>
          <label>MES PO to MWS Qty<input name="poQty" type="number" min="0" required></label>
          <label>Due Date<input name="dueDate" type="date"></label>
          <label>Folder Name<input name="folderName" placeholder="Se genera automáticamente"></label>
        </div>
        <div class="section-title">Process</div>
        <div class="task-list" id="newTasks"></div>
        <div class="section-title">Notes</div>
        <textarea name="notes" rows="3" placeholder="Notas del PrePPAP..."></textarea>
        <div class="form-actions">
          <button type="button" class="secondary" id="cancelModal">Cancel</button>
          <button class="primary" type="submit">Create PrePPAP</button>
        </div>
      </form>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
