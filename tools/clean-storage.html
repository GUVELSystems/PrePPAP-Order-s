<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GUVEL PrePPAP Storage Cleanup</title><style>body{font-family:Arial,sans-serif;background:#f4f7fa;color:#172536;max-width:760px;margin:50px auto;padding:20px}main{background:#fff;border:1px solid #d9e2ea;padding:28px;box-shadow:0 8px 24px #0f1b2d12}h1{margin:0 0 8px}p{color:#6b7c8e;font-size:14px}label{display:block;font-size:12px;font-weight:700;margin:14px 0 6px}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd7e0}button{margin-top:18px;padding:10px 16px;border:0;background:#0f1b2d;color:white;font-weight:700;cursor:pointer}button.danger{background:#ff3131}pre{white-space:pre-wrap;background:#f7f9fb;border:1px solid #e1e8ee;padding:12px;font-size:12px}</style></head><body><main><h1>GUVEL PrePPAP — Storage Cleanup</h1><p>Use this only after running <b>tools/clean_start.sql</b>. It removes files from the <b>preppap-documents</b> bucket through the Supabase Storage API; it does not use direct SQL deletion.</p><label>Supabase URL</label><input id="url" placeholder="https://xxxx.supabase.co"><label>Anon / Publishable Key</label><input id="key" placeholder="eyJ..."><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button id="run" class="danger">Sign in and delete all PrePPAP storage files</button><pre id="log">Ready.</pre></main><script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const $=id=>document.getElementById(id),log=m=>$("log").textContent+=`\n${m}`;
async function allFiles(sb,path=""){let out=[],offset=0;while(true){const {data,error}=await sb.storage.from("preppap-documents").list(path,{limit:100,offset});if(error)throw error;if(!data?.length)break;for(const item of data){const full=path?`${path}/${item.name}`:item.name;if(item.id===null){out.push(...await allFiles(sb,full));}else out.push(full);}if(data.length<100)break;offset+=100;}return out;}
$("run").onclick=async()=>{const btn=$("run");btn.disabled=true;$("log").textContent="Starting…";try{const sb=createClient($("url").value.trim(),$("key").value.trim());const {error:authError}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(authError)throw authError;const files=await allFiles(sb);log(`Found ${files.length} storage object(s).`);if(files.length){for(let i=0;i<files.length;i+=100){const {error}=await sb.storage.from("preppap-documents").remove(files.slice(i,i+100));if(error)throw error;log(`Deleted ${Math.min(i+100,files.length)} / ${files.length}`);}}log("Cleanup completed. You can close this page.");}catch(e){log(`ERROR: ${e.message}`);}finally{btn.disabled=false;}};
</script></body></html>
